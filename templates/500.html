{% extends "base.html" %}
{% block title %}Server error{% endblock %}
{% block auth %}
<section class="auth-wrap">
  <div class="auth-story">
    <div class="brand light">
      <span class="logo">A</span>
      <span><strong>Aureum</strong><small>Oops</small></span>
    </div>
    <h1>500 — Server error</h1>
    <p>Something went wrong on our end. We're working to fix it.</p>
  </div>
  <div class="auth-card">
    <div class="text-center">
      <i class="bi bi-bug" style="font-size: 4rem; color: #ff6b6b;"></i>
      <h2 class="mt-3">Something broke</h2>
      <p class="muted">An unexpected error occurred. Please try again later.</p>
      <a href="{{ url_for('dashboard') }}" class="btn-primary">Go to Dashboard</a>
      <p class="muted mt-3"><a href="{{ url_for('login') }}">Sign in</a></p>
    </div>
  </div>
</section>
{% endblock %}

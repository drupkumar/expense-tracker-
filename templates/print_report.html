<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Aureum printable report</title><style>body{font:14px Arial;margin:32px;color:#18251f}h1{margin-bottom:4px}table{width:100%;border-collapse:collapse;margin-top:24px}th,td{text-align:left;border-bottom:1px solid #ddd;padding:8px}button{padding:10px 14px}@media print{button{display:none}}</style></head><body><button onclick="window.print()">Print report</button><h1>Aureum transaction summary</h1><p>Generated {{ today }} · Latest {{ rows|length }} transactions</p><table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Merchant</th><th>Method</th><th>Amount</th></tr></thead><tbody>{% for t in rows %}<tr><td>{{ t.txn_date }}</td><td>{{ t.kind }}</td><td>{{ t.category.name }}</td><td>{{ t.merchant or t.note }}</td><td>{{ t.payment_method }}</td><td>{{ money(t.amount) }}</td></tr>{% endfor %}</tbody></table></body></html>

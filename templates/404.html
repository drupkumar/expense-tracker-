{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block auth %}
<section class="auth-wrap">
  <div class="auth-story">
    <div class="brand light">
      <span class="logo">A</span>
      <span><strong>Aureum</strong><small>Oops</small></span>
    </div>
    <h1>404 — Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
  </div>
  <div class="auth-card">
    <div class="text-center">
      <i class="bi bi-exclamation-circle" style="font-size: 4rem; color: #ff6b6b;"></i>
      <h2 class="mt-3">Lost in the numbers?</h2>
      <p class="muted">That page doesn't exist. Return to your ledger.</p>
      <a href="{{ url_for('dashboard') }}" class="btn-primary">Go to Dashboard</a>
      <p class="muted mt-3"><a href="{{ url_for('login') }}">Sign in</a></p>
    </div>
  </div>
</section>
{% endblock %}
